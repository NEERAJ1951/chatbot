version: '3.8'

services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: upsc_mentor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upsc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upsc_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-upsc_mentor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upsc_admin -d upsc_mentor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: upsc_mentor_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://upsc_admin:upsc_secure_password_2026@db:5432/upsc_mentor_db
      - PORT=5000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-upsc-mentor-ai-production-secret-key-2026}
      - DEFAULT_LLM_MODEL=gemini-2.5-flash
      - EMBEDDING_MODEL=text-embedding-004
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: upsc_mentor_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
